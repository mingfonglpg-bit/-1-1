<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業級智慧倉儲庫位控管系統 - 商業專業版</title>
    <style>
        :root { 
            --primary: #06b6d4; --primary-hover: #0891b2; --warning: #f59e0b; --danger: #ef4444; --edit: #10b981;
            --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc; --text-dim: #94a3b8; --border: rgba(255, 255, 255, 0.12);
            --select-bg: #1e293b; --select-text: #c7d2fe;
            --color-polar-l: #38bdf8; --color-polar-r: #818cf8;
            --color-cool-l:  #fbbf24; --color-cool-r:  #fb7185;
            --color-normal:  #34d399; --color-cut:     #a855f7;
            --color-restock: #ec4899;
            --filter-range-15: #ef4444; --filter-range-30: #f97316; --filter-range-60: #eab308;
        }
        * { box-sizing: border-box; transition: all 0.2s; }
        body { font-family: 'Inter', "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text-main); margin: 0; line-height: 1.5; min-height: 100vh; }
        
        .container { width: 95%; max-width: 1400px; margin: 20px auto; background: var(--card-bg); backdrop-filter: blur(20px); padding: 25px; border-radius: 28px; border: 1px solid var(--border); display: none; }
        
        /* 登入 / 註冊頁面 (REG模組整合) */
        .auth-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 20000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--select-bg); border: 1px solid var(--primary); border-radius: 24px; padding: 35px; width: 100%; max-width: 440px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 25px; }
        .auth-tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: var(--text-dim); font-weight: bold; }
        .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .auth-form-group { margin-bottom: 18px; text-align: left; }
        .auth-form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
        .auth-input { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; color: white; outline: none; font-size: 14px; }
        .auth-input:focus { border-color: var(--primary); }

        /* UI 元件樣式 */
        .marquee-container { background: rgba(6, 182, 212, 0.1); border-radius: 12px; padding: 8px 15px; margin-bottom: 15px; overflow: hidden; white-space: nowrap; border: 1px solid rgba(6, 182, 212, 0.2); }
        .marquee-text { display: inline-block; animation: marquee 20s linear infinite; color: var(--primary); font-weight: 500; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .daily-alert-bar { background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--danger); padding: 12px 20px; margin-bottom: 15px; border-radius: 8px; font-size: 14px; color: #fca5a5; display: none; cursor: pointer; }
        .expired-section { display: none; background: rgba(245, 158, 11, 0.05); border: 1px solid rgba(245, 158, 11, 0.2); padding: 20px; border-radius: 20px; margin-bottom: 25px; }
        .expired-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        .expired-card { background: rgba(30, 41, 59, 0.9); border: 1px solid var(--border); padding: 15px; border-radius: 14px; }
        
        .search-action-bar { display: none; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 12px 20px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 15px; font-size: 14px; }
        .btn-excel-mini { background: #10b981 !important; color: white !important; font-size: 12px !important; padding: 6px 12px !important; border-radius: 8px !important; cursor: pointer; border: none; font-weight: bold; }
        .empty-count-badge { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        select.btn, input.btn { background: var(--select-bg) !important; color: var(--select-text) !important; border: 1px solid var(--border); padding: 12px; border-radius: 12px; outline: none; width: 100%; font-size: 14px; }
        .usage-badge { background: rgba(6, 182, 212, 0.15); color: var(--primary); padding: 8px 16px; border-radius: 12px; font-weight: bold; border: 1px solid rgba(6, 182, 212, 0.2); }
        
        .slot { aspect-ratio: 1; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; gap: 2px; font-weight: bold; color: var(--text-main); }
        .slot span.count { font-size: 9px; opacity: 0.8; font-weight: normal; }
        .slot.occupied { color: white; }
        .slot.status-warning { background: var(--warning) !important; }
        .slot.status-danger { background: var(--danger) !important; }
        .slot.status-cut { background: var(--color-cut) !important; color: white; }
        .slot.status-group-b { background: var(--color-restock) !important; color: white; }
        
        .date-filter-group { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn-filter { background: #1e293b; color: var(--text-dim); border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-filter.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3); }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; margin-top: 15px; }
        th { color: var(--text-dim); padding: 15px 20px; text-align: left; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 18px 20px; background: rgba(255, 255, 255, 0.03); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); vertical-align: middle; }
        td:first-child { border-left: 1px solid var(--border); border-radius: 15px 0 0 15px; }
        td:last-child { border-right: 1px solid var(--border); border-radius: 0 15px 15px 0; }
        
        .btn-main { padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: var(--primary); color: white; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; justify-content: center; }
        .btn-main:hover { background: var(--primary-hover); transform: translateY(-2px); }
        
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:11000; justify-content:center; align-items:center; backdrop-filter: blur(5px); }
        .modal-content { background:var(--select-bg); padding:30px; border-radius:28px; width:90%; max-width:520px; border:1px solid var(--primary); max-height: 90vh; overflow-y: auto; }
        #loader { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:12000; justify-content:center; align-items:center; color:white; font-weight: bold; }
        
        .sync-toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(120px); background:linear-gradient(135deg,#10b981,#06b6d4); color:#fff; padding:15px 30px; border-radius:50px; box-shadow:0 10px 30px rgba(0,0,0,.4); z-index:13000; opacity:0; transition:all .5s cubic-bezier(.16,1,.3,1); font-weight:bold; }
        .sync-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* RWD 卡片化 */
        @media screen and (max-width: 768px) {
            thead { display: none; }
            table, tbody, tr, td { display: block; width: 100%; }
            tr { margin-bottom: 15px; border: 1px solid var(--border); border-radius: 18px; background: rgba(30, 41, 59, 0.8) !important; padding: 5px 0; }
            td { display: none !important; padding: 10px 16px; text-align: right; border: none !important; justify-content: space-between; align-items: center; }
            td[data-label="儲位位置"], td[data-label="產品內容"] { display: flex !important; } 
            tr.expanded td { display: flex !important; }
            td::before { content: attr(data-label); float: left; color: var(--text-dim); font-size: 12px; }
            #visualGrid { grid-template-columns: repeat(5, 1fr) !important; }
        }
    </style>
</head>
<body>

<div id="loader">⚙️ 資料同步處理中...</div>
<div id="syncToast" class="sync-toast"></div>

<!-- REG 註冊/登入 整合模組視窗 -->
<div id="authModal" class="auth-overlay">
    <div class="auth-card">
        <h2 style="text-align:center; margin-top:0; color:var(--primary); font-size: 1.5rem;" id="sysTitleDisplay">📦 智慧倉儲管理系統</h2>
        <div class="auth-tabs">
            <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">使用者登入</div>
            <div class="auth-tab" id="tabReg" onclick="switchAuthTab('reg')">新帳號註冊</div>
        </div>
        
        <!-- 登入表單 -->
        <div id="formLogin">
            <div class="auth-form-group">
                <label>帳號 / 電子郵件</label>
                <input type="text" id="loginUser" class="auth-input" placeholder="請輸入帳號">
            </div>
            <div class="auth-form-group">
                <label>密碼</label>
                <input type="password" id="loginPass" class="auth-input" placeholder="請輸入密碼">
            </div>
            <button class="btn-main" style="width:100%; margin-top:15px; padding:12px;" onclick="handleLogin()">🚀 登入系統</button>
            <button class="btn-main" style="width:100%; margin-top:10px; padding:12px; background:#475569;" onclick="handleGuestAccess()">👀 快速訪問（僅檢視，無需登入）</button>
            <div style="margin-top:15px; text-align:center;">
                <a href="#" style="color:var(--text-dim); font-size:12px; text-decoration:none;" onclick="startOnboardingWizard()">⚙️ 初次使用？啟動建檔精靈</a>
            </div>
        </div>

        <!-- 註冊表單 -->
        <div id="formReg" style="display:none;">
            <div class="auth-form-group">
                <label>設定使用者帳號</label>
                <input type="text" id="regUser" class="auth-input" placeholder="建議使用英文或 Email">
            </div>
            <div class="auth-form-group">
                <label>設定密碼</label>
                <input type="password" id="regPass" class="auth-input" placeholder="至少 6 位字元">
            </div>
            <div class="auth-form-group">
                <label>權限類別</label>
                <select id="regRole" class="auth-input" style="background:var(--select-bg)">
                    <option value="operator">現場操作員 (可查詢、回報)</option>
                    <option value="admin">系統管理員 (全權限)</option>
                </select>
            </div>
            <button class="btn-main" style="width:100%; margin-top:15px; padding:12px; background:var(--edit);" onclick="handleRegister()">📝 送出註冊</button>
        </div>
    </div>
</div>

<!-- 從0開始建檔 / 首次開箱導覽精靈 -->
<div id="wizardModal" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--primary); margin-top:0;">✨ 歡迎使用！從 0 開始建立您的倉儲</h3>
        <p style="font-size:13px; color:var(--text-dim);">只需 3 個步驟，即可完成您的專屬倉儲控管系統建檔：</p>
        
        <div id="wizardStep1">
            <h4>第 1 步：設定企業與倉庫名稱</h4>
            <input type="text" id="wizBrand" class="btn" placeholder="例如：極速物流 倉儲系統" value="我的智慧倉儲中心">
            <button class="btn-main" style="width:100%; margin-top:15px;" onclick="nextWizStep(2)">下一步 ➔</button>
        </div>

        <div id="wizardStep2" style="display:none;">
            <h4>第 2 步：設定第一個倉庫區域格局</h4>
            <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:8px;">
                <input type="text" id="wizZoneName" class="btn" placeholder="區域名稱" value="常溫 A 區">
                <input type="number" id="wizFloors" class="btn" placeholder="樓層" value="4">
                <input type="number" id="wizPerFloor" class="btn" placeholder="每層庫位" value="20">
            </div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn-main" style="background:#475569; flex:1;" onclick="nextWizStep(1)">上一頁</button>
                <button class="btn-main" style="flex:1;" onclick="nextWizStep(3)">下一步 ➔</button>
            </div>
        </div>

        <div id="wizardStep3" style="display:none;">
            <h4>第 3 步：選擇資料備份後端</h4>
            <select id="wizBackendMode" class="btn" onchange="toggleWizBackendFields()">
                <option value="google_gs">Google Apps Script (一般版)</option>
                <option value="supabase">Supabase (企業級高效能)</option>
            </select>
            <div id="wizGsGroup" style="margin-top:10px;">
                <input type="text" id="wizScriptUrl" class="btn" placeholder="貼上 Google Web App URL (可暫留空以本機體驗)">
            </div>
            <div id="wizSupaGroup" style="margin-top:10px; display:none;">
                <input type="text" id="wizSupaUrl" class="btn" placeholder="Supabase URL" style="margin-bottom:8px;">
                <input type="text" id="wizSupaKey" class="btn" placeholder="Supabase Publishable/Anon Key">
            </div>
            <button class="btn-main" style="width:100%; margin-top:20px; background:var(--edit);" onclick="completeOnboarding()">🎉 完成設定並啟動系統</button>
        </div>
    </div>
</div>

<!-- 主控制台畫面 -->
<div class="container" id="main-container">
    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0;" id="appBrandTitle">📦 庫位狀態</h2>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <span id="userBadge" style="font-size:12px; background:rgba(255,255,255,0.1); padding:6px 12px; border-radius:20px;">👤 檢視者</span>
            <button id="netStatusBtn" onclick="toggleNetworkMode()" class="btn-main" style="background:#10b981;">🌐 線上模式</button>
            <button onclick="fetchData()" class="btn-main" style="background:#334155;">🔄 刷新</button>
            <button id="backendSettingsBtn" onclick="openBackendSettings()" class="btn-main" style="background:#4338ca;">☁️ 資料服務</button>
            <button onclick="handleLogout()" class="btn-main" style="background:var(--danger);">🚪 登出</button>
        </div>
    </header>

    <div class="marquee-container">
        <div class="marquee-text" id="marqueeDisplay">🔔 歡迎使用智慧倉儲系統，請點擊新增入庫進行初次建檔。</div>
    </div>

    <!-- 管理員新增入庫面板 -->
    <div id="admin-panel" style="display:none; background:rgba(6,182,212,0.05); padding:20px; border-radius:24px; border:1px solid var(--primary); margin-bottom:25px;">
        <h4 style="margin-top:0; color:var(--primary);">➕ 產品新增入庫建檔</h4>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap:10px;">
            <select id="addZone" class="btn"></select>
            <select id="addFloor" class="btn"></select>
            <input type="number" id="addPos" placeholder="儲位號" class="btn">
            <input type="text" id="addName" placeholder="產品名稱" class="btn">
            <input type="text" id="addBatch" placeholder="批號" class="btn">
            <input type="date" id="addDate" class="btn">
            <input type="text" id="addNote" placeholder="備註" class="btn">
            <button onclick="submitFormAction('add')" class="btn-main">➕ 入庫建檔</button>
        </div>
    </div>

    <!-- 視覺化地圖地圖 -->
    <section style="background: rgba(255,255,255,0.02); padding: 20px; border-radius: 24px; border: 1px solid var(--border); margin-bottom:25px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
            <div>
                <b id="mapTitle" style="color:var(--primary); font-size:16px;">儲位視覺化圖譜</b>
                <span id="floorEmptyCount" class="empty-count-badge" style="margin-left:10px;">🔲 空庫位: --</span>
            </div>
            <div style="display:flex; gap:8px;">
                <button id="zoneManageBtn" onclick="openZoneManageModal()" class="btn-main" style="display:none; background:#0e7490; font-size:12px;">🏭 區域庫位格局設定</button>
                <select id="vZone" onchange="renderVisual()" class="btn" style="width:130px;"></select>
                <select id="vFloor" onchange="renderVisual()" class="btn" style="width:80px;"></select>
            </div>
        </div>
        <div id="visualGrid" style="display:grid; gap:8px;"></div>
    </section>

    <!-- 庫存列表表格 -->
    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th onclick="sortTable('zone')" style="cursor:pointer; user-select:none;">儲位 <span id="sortIcon-zone"></span></th>
                    <th onclick="sortTable('name')" style="cursor:pointer; user-select:none;">產品名稱 <span id="sortIcon-name"></span></th>
                    <th onclick="sortTable('date')" style="cursor:pointer; user-select:none;">有效日期 <span id="sortIcon-date"></span></th>
                    <th onclick="sortTable('batch')" style="cursor:pointer; user-select:none;">批號 <span id="sortIcon-batch"></span></th>
                    <th>備註與狀態</th><th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- 區域管理彈窗 -->
<div id="zoneManageModal" class="modal">
    <div class="modal-content">
        <h3>🏭 倉儲區域格局管理</h3>
        <div id="zoneManageList" style="display:flex; flex-direction:column; gap:10px; margin-bottom:15px;"></div>
        <div style="border-top:1px dashed var(--border); padding-top:15px;">
            <b>➕ 新增區域</b>
            <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:8px; margin-top:8px;">
                <input type="text" id="zmNewName" class="btn" placeholder="區域名稱">
                <input type="number" id="zmNewFloors" class="btn" placeholder="樓層" value="1">
                <input type="number" id="zmNewPerFloor" class="btn" placeholder="每層號碼" value="10">
            </div>
            <button class="btn-main" style="width:100%; margin-top:10px; background:var(--edit);" onclick="addZoneEntry()">➕ 新增區域</button>
        </div>
        <button class="btn-main" style="background:#475569; width:100%; margin-top:15px;" onclick="closeModal('zoneManageModal')">關閉</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    /* ============ 核心商業版 State 控制 ============ */
    let currentUser = JSON.parse(sessionStorage.getItem('warehouse_user') || 'null');
    let ZONE_SETUP = JSON.parse(localStorage.getItem('warehouse_zone_setup') || 'null');
    let BACKEND_CONFIG = JSON.parse(localStorage.getItem('warehouse_backend_config') || 'null');
    let WAREHOUSE_SETUP = JSON.parse(localStorage.getItem('warehouse_setup_config') || 'null');

    let inventory = [];
    let supabaseClient = null;
    let isOfflineMode = false;
    let currentSort = { key: null, dir: 1 };

    // 初始化 Supabase 連線
    function initSupabase() {
        if (BACKEND_CONFIG && BACKEND_CONFIG.mode === 'supabase' && BACKEND_CONFIG.supabaseUrl && BACKEND_CONFIG.supabaseKey) {
            const { createClient } = supabase;
            supabaseClient = createClient(BACKEND_CONFIG.supabaseUrl, BACKEND_CONFIG.supabaseKey);
            console.log("✅ Supabase 連線已初始化");
        }
    }

    /* 初始化頁面狀態 */
    window.onload = function() {
        if (!WAREHOUSE_SETUP) {
            startOnboardingWizard();
        } else {
            applyBrandSettings();
            initSupabase(); // 初始化 Supabase
            if (currentUser) {
                initApp();
            } else {
                document.getElementById('authModal').style.display = 'flex';
            }
        }
    };

    function applyBrandSettings() {
        if (WAREHOUSE_SETUP && WAREHOUSE_SETUP.brand) {
            document.getElementById('sysTitleDisplay').innerText = "📦 " + WAREHOUSE_SETUP.brand;
            document.getElementById('appBrandTitle').innerText = WAREHOUSE_SETUP.brand;
            document.title = WAREHOUSE_SETUP.brand;
        }
    }

    /* === REG / Auth 驗證機制 === */
    function switchAuthTab(type) {
        document.getElementById('tabLogin').classList.toggle('active', type === 'login');
        document.getElementById('tabReg').classList.toggle('active', type === 'reg');
        document.getElementById('formLogin').style.display = type === 'login' ? 'block' : 'none';
        document.getElementById('formReg').style.display = type === 'reg' ? 'block' : 'none';
    }

    function handleLogin() {
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value.trim();
        if (!u || !p) { alert('請輸入帳號與密碼'); return; }

        let users = JSON.parse(localStorage.getItem('warehouse_users_db') || '[]');
        if (users.length === 0 && u === 'admin' && p === 'admin123') {
            users.push({ username: 'admin', pass: 'admin123', role: 'admin' });
            localStorage.setItem('warehouse_users_db', JSON.stringify(users));
        }

        const found = users.find(x => x.username === u && x.pass === p);
        if (found) {
            currentUser = found;
            sessionStorage.setItem('warehouse_user', JSON.stringify(currentUser));
            document.getElementById('authModal').style.display = 'none';
            initApp();
        } else {
            alert('帳號或密碼錯誤！(預設管理者: admin / admin123)');
        }
    }

    function handleRegister() {
        const u = document.getElementById('regUser').value.trim();
        const p = document.getElementById('regPass').value.trim();
        const r = document.getElementById('regRole').value;
        if (!u || !p) { alert('請填寫完整註冊資訊'); return; }

        let users = JSON.parse(localStorage.getItem('warehouse_users_db') || '[]');
        if (users.some(x => x.username === u)) { alert('該帳號已被註冊'); return; }

        users.push({ username: u, pass: p, role: r });
        localStorage.setItem('warehouse_users_db', JSON.stringify(users));
        alert('註冊成功！請直接登入');
        switchAuthTab('login');
    }

    function handleLogout() {
        sessionStorage.removeItem('warehouse_user');
        location.reload();
    }

    /* 快速訪問：不需登入，僅能觀看（不儲存登入狀態，重新整理即登出） */
    function handleGuestAccess() {
        currentUser = { username: '訪客', role: 'guest' };
        document.getElementById('authModal').style.display = 'none';
        initApp();
    }

    /* === 從 0 開始建檔 Onboarding Wizard === */
    function startOnboardingWizard() {
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('wizardModal').style.display = 'flex';
    }

    function nextWizStep(step) {
        document.getElementById('wizardStep1').style.display = step === 1 ? 'block' : 'none';
        document.getElementById('wizardStep2').style.display = step === 2 ? 'block' : 'none';
        document.getElementById('wizardStep3').style.display = step === 3 ? 'block' : 'none';
    }

    function toggleWizBackendFields() {
        const m = document.getElementById('wizBackendMode').value;
        document.getElementById('wizGsGroup').style.display = m === 'google_gs' ? 'block' : 'none';
        document.getElementById('wizSupaGroup').style.display = m === 'supabase' ? 'block' : 'none';
    }

    function completeOnboarding() {
        const brand = document.getElementById('wizBrand').value.trim() || "智慧倉儲系統";
        const zName = document.getElementById('wizZoneName').value.trim() || "區域 A";
        const floors = parseInt(document.getElementById('wizFloors').value) || 4;
        const perFloor = parseInt(document.getElementById('wizPerFloor').value) || 20;
        const mode = document.getElementById('wizBackendMode').value;

        WAREHOUSE_SETUP = { brand, version: 'V28.1 Commercial' };
        ZONE_SETUP = [{ name: zName, floors, perFloor }];
        BACKEND_CONFIG = {
            mode,
            scriptUrl: document.getElementById('wizScriptUrl').value.trim(),
            supabaseUrl: document.getElementById('wizSupaUrl').value.trim(),
            supabaseKey: document.getElementById('wizSupaKey').value.trim()
        };

        localStorage.setItem('warehouse_setup_config', JSON.stringify(WAREHOUSE_SETUP));
        localStorage.setItem('warehouse_zone_setup', JSON.stringify(ZONE_SETUP));
        localStorage.setItem('warehouse_backend_config', JSON.stringify(BACKEND_CONFIG));

        closeModal('wizardModal');
        applyBrandSettings();
        initSupabase();
        document.getElementById('authModal').style.display = 'flex';
    }

    /* === 主程式啟動 === */
    function initApp() {
        document.getElementById('main-container').style.display = 'block';
        const roleLabel = currentUser.role === 'admin' ? '管理員' : (currentUser.role === 'guest' ? '訪客・僅檢視' : '操作員');
        document.getElementById('userBadge').innerText = `👤 ${currentUser.username} (${roleLabel})`;
        document.getElementById('admin-panel').style.display = currentUser.role === 'admin' ? 'block' : 'none';
        document.getElementById('zoneManageBtn').style.display = currentUser.role === 'admin' ? 'inline-block' : 'none';
        document.getElementById('backendSettingsBtn').style.display = currentUser.role === 'guest' ? 'none' : 'inline-flex';

        renderZoneSelects();
        renderFloorSelects();
        fetchData();
    }

    /* === 區域結構處理與 UI 渲染 === */
    function getEffectiveZones() {
        return ZONE_SETUP || [{ name: '預設區域', floors: 1, perFloor: 10 }];
    }

    function renderZoneSelects() {
        const zones = getEffectiveZones();
        ['vZone','addZone'].forEach(id => {
            const el = document.getElementById(id); if(!el) return;
            el.innerHTML = '';
            zones.forEach(z => {
                let opt = document.createElement('option');
                opt.value = z.name; opt.textContent = z.name;
                el.appendChild(opt);
            });
        });
    }

    function renderFloorSelects() {
        const zones = getEffectiveZones();
        const maxF = Math.max(...zones.map(z => z.floors || 1));
        ['vFloor','addFloor'].forEach(id => {
            const el = document.getElementById(id); if(!el) return;
            el.innerHTML = '';
            for(let i=1; i<=maxF; i++) {
                let opt = document.createElement('option');
                opt.value = i + 'F'; opt.textContent = i + 'F';
                el.appendChild(opt);
            }
        });
    }

    function renderVisual() {
        const zName = document.getElementById('vZone').value;
        const floor = document.getElementById('vFloor').value;
        const grid = document.getElementById('visualGrid');
        const zoneObj = getEffectiveZones().find(z => z.name === zName);

        if(!zoneObj) { grid.innerHTML = '<div style="padding:20px;">尚無區域設定</div>'; return; }

        grid.style.gridTemplateColumns = `repeat(${Math.min(zoneObj.perFloor, 10)}, 1fr)`;
        grid.innerHTML = '';

        let occupied = 0;
        for(let i=1; i<=zoneObj.perFloor; i++) {
            const items = inventory.filter(x => x.zone === zName && x.floor === floor && Number(x.pos) === i);
            const slot = document.createElement('div');
            slot.className = 'slot' + (items.length ? ' occupied' : '');
            if(items.length) {
                slot.style.background = 'var(--primary)';
                slot.title = items.map(it => it.name).join('、');
                slot.innerHTML = `<div>${i}</div><span class="count">${items.length} 件</span>`;
                occupied++;
            } else {
                slot.innerHTML = `<div>${i}</div>`;
            }
            grid.appendChild(slot);
        }
        document.getElementById('floorEmptyCount').innerText = `🔲 空庫位: ${zoneObj.perFloor - occupied}`;
    }

    function sortTable(key) {
        if (currentSort.key === key) {
            currentSort.dir *= -1;
        } else {
            currentSort.key = key;
            currentSort.dir = 1;
        }
        renderTable();
    }

    function getSortedInventory() {
        if (!currentSort.key) return inventory;
        const key = currentSort.key;
        return [...inventory].sort((a, b) => {
            let va, vb;
            if (key === 'zone') {
                va = `${a.zone}${a.floor}${String(a.pos).padStart(6,'0')}`;
                vb = `${b.zone}${b.floor}${String(b.pos).padStart(6,'0')}`;
            } else {
                va = (a[key] || '');
                vb = (b[key] || '');
            }
            if (va < vb) return -1 * currentSort.dir;
            if (va > vb) return 1 * currentSort.dir;
            return 0;
        });
    }

    function updateSortIcons() {
        ['zone', 'name', 'date', 'batch'].forEach(k => {
            const el = document.getElementById('sortIcon-' + k);
            if (!el) return;
            el.innerText = currentSort.key === k ? (currentSort.dir === 1 ? '▲' : '▼') : '';
        });
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const sortedInventory = getSortedInventory();
        updateSortIcons();
        if (sortedInventory.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--text-dim);">目前尚無任何產品庫存建檔，請點擊上方【新增入庫建檔】。</td></tr>`;
            return;
        }
        tbody.innerHTML = sortedInventory.map(i => `
            <tr>
                <td data-label="儲位位置"><b>${i.zone} ${i.floor}-${i.pos}</b></td>
                <td data-label="產品名稱">${i.name}</td>
                <td data-label="有效日期">${i.date || '-'}</td>
                <td data-label="批號"><code>${i.batch || '-'}</code></td>
                <td data-label="備註">${i.note || '-'}</td>
                <td data-label="操作">
                    ${currentUser.role === 'admin' ? `<button class="btn-main" style="background:var(--danger); padding:4px 8px; font-size:12px;" onclick="deleteItem('${i.id}')">🗑️ 刪除</button>` : '-'}
                </td>
            </tr>
        `).join('');
    }

    /* === 【重點】對接 Supabase 雲端資料庫 API === */
    async function fetchData() {
        document.getElementById('loader').style.display = 'flex';
        
        // 如果有設定 Supabase 且非離線模式，優先從 Supabase 抓取資料
        if (supabaseClient && !isOfflineMode) {
            try {
                const { data, error } = await supabaseClient.from('inventory').select('*');
                if (error) throw error;
                inventory = data || [];
                // 快取一份到 LocalStorage 備用
                localStorage.setItem('warehouse_local_inventory', JSON.stringify(inventory));
            } catch (err) {
                console.error('Supabase 讀取失敗，改從本機讀取:', err.message);
                let cached = localStorage.getItem('warehouse_local_inventory');
                inventory = cached ? JSON.parse(cached) : [];
            }
        } else {
            // 無連線資訊時讀取本機
            let cached = localStorage.getItem('warehouse_local_inventory');
            inventory = cached ? JSON.parse(cached) : [];
        }

        document.getElementById('loader').style.display = 'none';
        renderVisual();
        renderTable();
    }

    async function submitFormAction(action) {
        if(action === 'add') {
            const newItem = {
                id: 'item_' + Date.now(),
                zone: document.getElementById('addZone').value,
                floor: document.getElementById('addFloor').value,
                pos: Number(document.getElementById('addPos').value),
                name: document.getElementById('addName').value.trim(),
                batch: document.getElementById('addBatch').value.trim(),
                date: document.getElementById('addDate').value,
                note: document.getElementById('addNote').value.trim()
            };
            if(!newItem.pos || !newItem.name) { alert('請填寫儲位號碼與產品名稱'); return; }

            document.getElementById('loader').style.display = 'flex';

            // 寫入 Supabase 雲端 (離線模式下略過雲端同步)
            if (supabaseClient && !isOfflineMode) {
                try {
                    const { error } = await supabaseClient.from('inventory').insert([newItem]);
                    if (error) throw error;
                    showToast('☁️ 成功同步上傳至 Supabase！');
                } catch (err) {
                    alert('Supabase 上傳失敗: ' + err.message);
                }
            } else if (isOfflineMode) {
                showToast('📴 離線模式：已暫存至本機，恢復連線後請按刷新同步');
            } else {
                showToast('💾 已暫存至本機 (未設定 Supabase)');
            }

            // 更新本機狀態
            inventory.push(newItem);
            localStorage.setItem('warehouse_local_inventory', JSON.stringify(inventory));
            
            document.getElementById('loader').style.display = 'none';
            renderVisual(); 
            renderTable();
        }
    }

    async function deleteItem(id) {
        if(confirm('確定要刪除這筆產品庫存嗎？')) {
            document.getElementById('loader').style.display = 'flex';

            // 從 Supabase 刪除 (離線模式下僅刪除本機資料)
            if (supabaseClient && !isOfflineMode) {
                try {
                    const { error } = await supabaseClient.from('inventory').delete().eq('id', id);
                    if (error) throw error;
                    showToast('🗑️ 雲端資料刪除成功');
                } catch (err) {
                    alert('刪除失敗: ' + err.message);
                }
            } else if (isOfflineMode) {
                showToast('📴 離線模式：已刪除本機資料');
            }

            inventory = inventory.filter(x => x.id !== id);
            localStorage.setItem('warehouse_local_inventory', JSON.stringify(inventory));
            
            document.getElementById('loader').style.display = 'none';
            renderVisual(); 
            renderTable();
        }
    }

    /* === 工具函式 === */
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showToast(msg) {
        const t = document.getElementById('syncToast');
        t.innerText = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
    function toggleNetworkMode() {
        isOfflineMode = !isOfflineMode;
        const btn = document.getElementById('netStatusBtn');
        btn.style.background = isOfflineMode ? '#64748b' : '#10b981';
        btn.innerText = isOfflineMode ? "📴 離線模式" : "🌐 線上模式";
        if (isOfflineMode) {
            showToast('📴 已切換為離線模式，資料僅存於本機');
        } else {
            showToast('🌐 已切換為線上模式，正在與雲端同步...');
            fetchData(); // 恢復連線時重新同步一次
        }
    }
    function openBackendSettings() { startOnboardingWizard(); }
    function openZoneManageModal() {
        renderZoneManageList();
        document.getElementById('zoneManageModal').style.display = 'flex';
    }

    /* === 區域格局管理（新增／刪除） === */
    function renderZoneManageList() {
        const list = document.getElementById('zoneManageList');
        const zones = getEffectiveZones();
        if (!zones.length) {
            list.innerHTML = `<div style="color:var(--text-dim); font-size:13px;">尚無任何區域設定</div>`;
            return;
        }
        list.innerHTML = zones.map((z, idx) => `
            <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); padding:10px 14px; border-radius:12px; border:1px solid var(--border);">
                <div>
                    <b>${z.name}</b>
                    <div style="font-size:12px; color:var(--text-dim);">${z.floors} 樓層 × 每層 ${z.perFloor} 庫位</div>
                </div>
                <button class="btn-main" style="background:var(--danger); padding:6px 10px; font-size:12px;" onclick="deleteZoneEntry(${idx})">🗑️ 刪除</button>
            </div>
        `).join('');
    }

    function addZoneEntry() {
        const name = document.getElementById('zmNewName').value.trim();
        const floors = parseInt(document.getElementById('zmNewFloors').value) || 1;
        const perFloor = parseInt(document.getElementById('zmNewPerFloor').value) || 10;
        if (!name) { alert('請輸入區域名稱'); return; }

        const zones = getEffectiveZones();
        if (zones.some(z => z.name === name)) { alert('該區域名稱已存在'); return; }

        zones.push({ name, floors, perFloor });
        ZONE_SETUP = zones;
        localStorage.setItem('warehouse_zone_setup', JSON.stringify(ZONE_SETUP));

        document.getElementById('zmNewName').value = '';
        document.getElementById('zmNewFloors').value = '1';
        document.getElementById('zmNewPerFloor').value = '10';

        renderZoneSelects();
        renderFloorSelects();
        renderZoneManageList();
        renderVisual();
        showToast('✅ 區域新增成功');
    }

    function deleteZoneEntry(idx) {
        const zones = getEffectiveZones();
        if (zones.length <= 1) { alert('至少需保留一個區域'); return; }
        if (!confirm(`確定要刪除區域「${zones[idx].name}」嗎？`)) return;

        zones.splice(idx, 1);
        ZONE_SETUP = zones;
        localStorage.setItem('warehouse_zone_setup', JSON.stringify(ZONE_SETUP));

        renderZoneSelects();
        renderFloorSelects();
        renderZoneManageList();
        renderVisual();
        showToast('🗑️ 區域已刪除');
    }
</script>
</body>
</html>
