<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>庫存查詢</title>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>📦 庫存列表</h2>
    
    <!-- 1. 預留顯示資料的區塊 -->
    <ul id="itemList">載入中...</ul>

    <script>
        // 2. 替換為你的 Supabase 專案資訊
        const SUPABASE_URL = 'https://zkxsdcmgbtfpleynuyjb.supabase.co/';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpreHNkY21nYnRmcGxleW51eWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NjY1MDEsImV4cCI6MjEwMzE0MjUwMX0.r4rtK2ipC1ygHw_YFwtMhyIHqDX7vwSJJZAlH0B_rls
';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchAndRenderData() {
            // 3. 向 Supabase 查詢資料
            const { data, error } = await supabaseClient
                .from('inventory1') // 替換成你的資料表名稱
                .select('*');

            const listElement = document.getElementById('itemList');

            // 4. 錯誤處理
            if (error) {
                console.error('讀取失敗:', error);
                listElement.innerHTML = `<li style="color:red;">載入失敗：${error.message}</li>`;
                return;
            }

            // 5. 若無資料
            if (!data || data.length === 0) {
                listElement.innerHTML = '<li>目前沒有任何資料（請檢查 RLS 權限或資料表是否有內容）</li>';
                return;
            }

            // 6. 將資料轉為 HTML 並繪製到畫面上
            listElement.innerHTML = data.map(item => `
                <li>
                    <strong>${item.name || '未命名'}</strong> - 數量: ${item.quantity || 0}
                </li>
            `).join('');
        }

        // 執行載入
        fetchAndRenderData();
    </script>
</body>
</html>
