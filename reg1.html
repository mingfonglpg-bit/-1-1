<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>智慧倉儲管理系統</title>
    <!-- 修正為 UMD CDN 網址，確保全域 supabase 物件成功載入 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <h1>Supabase 身份驗證測試</h1>

  <!-- 狀態顯示 -->
  <div id="auth-status">載入中...</div>
  <hr>

  <!-- 登入與註冊表單 -->
  <div id="auth-form" style="display: none;">
    <h3>註冊 / 登入</h3>
    <input type="email" id="email" placeholder="電子郵件"><br><br>
    <input type="password" id="password" placeholder="密碼"><br><br>
    <button onclick="handleSignUp()">註冊帳號</button>
    <button onclick="handleSignIn()">密碼登入</button>
    
    <hr>
    <h4>第三方快速登入</h4>
    <button onclick="loginWithGitHub()" style="background: #24292e; color: white; padding: 5px 10px; cursor: pointer;">使用 GitHub 登入</button>
    <button onclick="loginWithGoogle()" style="background: #4285f4; color: white; padding: 5px 10px; cursor: pointer;">使用 Google 登入</button>
  </div>

  <!-- 登出面板 -->
  <div id="user-panel" style="display: none;">
    <h3>歡迎回來！</h3>
    <p>你的 User ID: <span id="user-id"></span></p>
    <button onclick="handleSignOut()">登出</button>
  </div>

  <script>
    // ⚠️ 請記得填入你自己的 Supabase 憑證
    const SUPABASE_URL = 'https://hyxpkalruglpeuftwmhz.supabase.co/';
    // 請至 Supabase > Project Settings > API 複製 anon public key 填入下方
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5eHBrYWxydWdscGV1ZnR3bWh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczODY3MDQsImV4cCI6MjEwMjk2MjcwNH0.LbV5Arfmebs9sRFTuBM8l2XvaerkJ-wIkNETsG6p2EI';

    // 檢查 Supabase 是否成功載入
    if (typeof supabase === 'undefined') {
      alert('Supabase SDK 載入失敗，請檢查網路或 CDN 網址！');
    } else {
      const { createClient } = supabase;
      const client = createClient(SUPABASE_URL, SUPABASE_KEY);

      const authStatus = document.getElementById('auth-status');
      const authForm = document.getElementById('auth-form');
      const userPanel = document.getElementById('user-panel');
      const userIdSpan = document.getElementById('user-id');

      // 監聽驗證狀態改變
      client.auth.onAuthStateChange((event, session) => {
        if (session) {
          authStatus.innerText = `目前狀態：已登入 (${session.user.email || '第三方登入'})`;
          userIdSpan.innerText = session.user.id;
          authForm.style.display = 'none';
          userPanel.style.display = 'block';
        } else {
          authStatus.innerText = '目前狀態：未登入';
          authForm.style.display = 'block';
          userPanel.style.display = 'none';
        }
      });

      // 實作註冊
      async function handleSignUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await client.auth.signUp({ email, password });
        if (error) alert('註冊失敗: ' + error.message);
        else alert('註冊成功！請檢查信箱或嘗試登入');
      }

      // 實作登入
      async function handleSignIn() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) alert('登入失敗: ' + error.message);
      }

      // GitHub 登入
      async function loginWithGitHub() {
        const { data, error } = await client.auth.signInWithOAuth({
          provider: 'github',
          options: { redirectTo: window.location.origin }
        });
        if (error) alert('GitHub 登入失敗: ' + error.message);
      }

      // Google 登入
      async function loginWithGoogle() {
        const { data, error } = await client.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin }
        });
        if (error) alert('Google 登入失敗: ' + error.message);
      }

      // 實作登出
      async function handleSignOut() {
        const { error } = await client.auth.signOut();
        if (error) alert('登出失敗: ' + error.message);
      }
    }
  </script>
</body>
</html>
